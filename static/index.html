<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta
        name="description"
        content="مجموعه‌ای رایگان از ابزارهای کاربردی نقشه و اطلاعات مکانی"
    >
    <meta name="theme-color" content="#2563eb">

    <title>ابزارهای مکانی آراز</title>

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    >
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
    <header class="topbar">
        <button
            id="sidebar-toggle"
            class="icon-button mobile-only"
            type="button"
            aria-label="نمایش ابزارها"
        >☰</button>

        <div class="brand">
            <span class="brand-icon">⌖</span>
            <div>
                <h1>ابزارهای مکانی آراز</h1>
                <p>ابزارهای رایگان نقشه و مختصات</p>
            </div>
        </div>

        <a
            class="github-link"
            href="#"
            id="github-link"
            target="_blank"
            rel="noopener"
            title="مخزن پروژه"
        >GitHub</a>
    </header>

    <main class="layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-head">
                <div>
                    <strong>ابزارها</strong>
                    <small>یک ابزار را انتخاب کنید</small>
                </div>
                <button
                    id="sidebar-close"
                    class="icon-button mobile-only"
                    type="button"
                    aria-label="بستن"
                >×</button>
            </div>

            <nav id="tool-list" class="tool-list">
                <button class="tool-button active" data-tool="coordinate">
                    <span>01</span>
                    <div>
                        <strong>مختصات نقطه</strong>
                        <small>روی نقشه کلیک کنید</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="bbox">
                    <span>02</span>
                    <div>
                        <strong>Bounding Box</strong>
                        <small>انتخاب محدوده مستطیلی</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="distance">
                    <span>03</span>
                    <div>
                        <strong>اندازه‌گیری فاصله</strong>
                        <small>ترسیم خط روی نقشه</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="area">
                    <span>04</span>
                    <div>
                        <strong>محاسبه مساحت</strong>
                        <small>ترسیم چندضلعی</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="draw">
                    <span>05</span>
                    <div>
                        <strong>ترسیم عوارض</strong>
                        <small>نقطه، خط و چندضلعی</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="convert">
                    <span>06</span>
                    <div>
                        <strong>تبدیل مختصات</strong>
                        <small>WGS84 و Web Mercator</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="search">
                    <span>07</span>
                    <div>
                        <strong>جست‌وجوی مکان</strong>
                        <small>با سرویس Map.ir</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="reverse">
                    <span>08</span>
                    <div>
                        <strong>مختصات به آدرس</strong>
                        <small>آدرس‌یابی معکوس</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="route">
                    <span>09</span>
                    <div>
                        <strong>مسیریابی</strong>
                        <small>مسیر بین دو نقطه</small>
                    </div>
                </button>

                <button class="tool-button" data-tool="export">
                    <span>10</span>
                    <div>
                        <strong>خروجی مکانی</strong>
                        <small>GeoJSON و WKT</small>
                    </div>
                </button>
            </nav>

            <div class="sidebar-footer">
                <span id="service-indicator" class="status-dot"></span>
                <span id="service-status">بررسی سرویس...</span>
            </div>
        </aside>

        <section class="map-section">
            <div id="map"></div>

            <section id="tool-panel" class="tool-panel">
                <div class="panel-header">
                    <div>
                        <h2 id="panel-title">مختصات نقطه</h2>
                        <p id="panel-description">
                            برای دریافت مختصات، روی نقشه کلیک کنید.
                        </p>
                    </div>
                    <button
                        id="panel-collapse"
                        class="icon-button"
                        type="button"
                        aria-label="جمع کردن پنل"
                    >⌄</button>
                </div>

                <div id="panel-body" class="panel-body"></div>
            </section>

            <div id="map-hint" class="map-hint">
                برای دریافت مختصات، روی نقشه کلیک کنید.
            </div>
        </section>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
